server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(jpg|jpeg|png|svg|woff2|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /Mark-Paine-CV.pdf {
        add_header Content-Disposition 'attachment; filename="Mark-Paine-CV.pdf"';
    }
}
