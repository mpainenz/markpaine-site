map $uri $content_disposition {
    default "";
    ~*\.pdf$ "attachment";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects must stay relative — an absolute redirect leaks the
    # internal origin host:port through CloudFront (broke /resume -> /resume/).
    absolute_redirect off;
    port_in_redirect off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Content-Disposition $content_disposition always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location ~* \.(jpg|jpeg|png|svg|woff2|css|js)$ {
        expires 7d;
    }
}
