name: build-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: markpaine-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and configuration tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render CV PDF from print stylesheet
        run: npm run pdf

      - name: Validate CV PDF
        run: npm run pdf:check

      - name: Route, responsive, link, and accessibility tests
        run: npm run test:site

      - name: Upload CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mark-Paine-CV
          path: out/Mark-Paine-CV.pdf

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_IMAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image coordinates
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - name: Check out GitOps repo
        if: vars.ENABLE_GITOPS_DEPLOY == 'true' && vars.GITOPS_REPOSITORY != '' && vars.GITOPS_PATH != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN || secrets.SOLUS_GITOPS_TOKEN }}
          path: gitops

      - name: Bump image tag in GitOps repo
        if: vars.ENABLE_GITOPS_DEPLOY == 'true' && vars.GITOPS_REPOSITORY != '' && vars.GITOPS_PATH != ''
        env:
          GITOPS_PATH: ${{ vars.GITOPS_PATH }}
        run: |
          cd "gitops/${GITOPS_PATH}"
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" kustomization.yaml
          if git diff --quiet; then
            echo "GitOps manifest already references ${GITHUB_SHA}."
            exit 0
          fi
          git config user.name "cv-site-ci"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "deploy: update CV site to ${GITHUB_SHA}"
          git push
